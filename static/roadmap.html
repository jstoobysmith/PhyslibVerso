<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physlib — roadmap</title>
  <meta name="description" content="Every result in Physlib, PhyslibAlpha, and the unformalized-claims corpus, as a phylogenetic tree of the libraries' directory structure.">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --surface-2: #f1f3f5;
      --border: #e5e7eb;
      --border-subtle: #eef0f2;
      --ink: #1a1a1a;
      --muted: #6b7280;
      --faint: #9ca3af;
      --accent: #0056b3;
      --link: #0056b3;
      /* Source colors — validated (dataviz skill) for CVD in both modes. */
      --physlib: #0056b3;
      --alpha: #e65100;
      --claims: #a01818;
      --edge: rgba(0, 0, 0, 0.13);
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1626; --surface: #16213e; --surface-2: #1c2947;
        --border: #2a2a4a; --border-subtle: #23233c;
        --ink: #e0e0e0; --muted: #9e9e9e; --faint: #6f7488;
        --accent: #90caf9; --link: #90caf9;
        --physlib: #4a89e0; --alpha: #cf7a28; --claims: #dd4870;
        --edge: rgba(255, 255, 255, 0.14);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1626; --surface: #16213e; --surface-2: #1c2947;
      --border: #2a2a4a; --border-subtle: #23233c;
      --ink: #e0e0e0; --muted: #9e9e9e; --faint: #6f7488;
      --accent: #90caf9; --link: #90caf9;
      --physlib: #4a89e0; --alpha: #cf7a28; --claims: #dd4870;
      --edge: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: var(--sans); color: var(--ink); background: var(--bg);
      display: flex; flex-direction: column; overflow: hidden; }

    /* ── Header ─────────────────────────────────────────────────── */
    .rm-header { display: flex; align-items: center; gap: 12px; height: 44px;
      padding: 0 14px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0; z-index: 10; }
    .rm-logo { font-size: 14px; font-weight: 600; letter-spacing: -0.2px;
      color: var(--accent); text-decoration: none; white-space: nowrap; }
    .rm-title { font-size: 10px; font-weight: 600; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .rm-legend { display: flex; align-items: center; gap: 14px; margin-left: 8px; }
    .rm-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px;
      color: var(--muted); cursor: pointer; user-select: none; }
    .rm-legend-item.off { opacity: 0.35; }
    .rm-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .rm-swatch.physlib { background: var(--physlib); }
    .rm-swatch.alpha { background: var(--alpha); }
    .rm-swatch.claims { background: var(--claims); }
    .rm-search { margin-left: auto; }
    .rm-search input { width: 220px; height: 30px; padding: 0 10px;
      font-family: var(--sans); font-size: 13px; color: var(--ink);
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px; outline: none; }
    .rm-search input:focus { border-color: var(--accent); }
    .rm-view { font-family: var(--sans); font-size: 11.5px; font-weight: 500;
      color: var(--muted); background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; height: 30px; padding: 0 6px; max-width: 190px; cursor: pointer; outline: none; }
    .rm-view:hover, .rm-view:focus { color: var(--accent); border-color: var(--accent); }
    .rm-search { position: relative; }
    .rm-search-results { display: none; position: absolute; top: 34px; right: 0;
      width: 340px; max-height: 420px; overflow-y: auto; z-index: 30; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.2); padding: 4px; }
    .rm-sr-item { display: flex; align-items: baseline; gap: 7px; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
    .rm-sr-item:hover { background: var(--surface-2); }
    .rm-sr-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; align-self: center; }
    .rm-sr-dot.physlib { background: var(--physlib); }
    .rm-sr-dot.alpha { background: var(--alpha); }
    .rm-sr-dot.claims { background: var(--claims); }
    .rm-sr-name { font-family: var(--mono); font-size: 11.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rm-sr-path { font-size: 10px; color: var(--faint); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; flex-shrink: 0; }
    .rm-sr-empty { padding: 8px 10px; font-size: 12px; color: var(--muted); }
    .rm-reset { position: absolute; top: 12px; left: 12px; z-index: 5; font-family: var(--sans);
      font-size: 11.5px; font-weight: 500; color: var(--muted); background: var(--surface);
      border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    .rm-reset:hover { color: var(--accent); border-color: var(--accent); }
    .rm-tooltip { position: absolute; pointer-events: none; z-index: 6; max-width: 340px; padding: 6px 9px;
      background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 6px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.18); font-size: 12px; opacity: 0; transition: opacity 0.08s; }
    .rm-tooltip .tt-name { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
    .rm-tooltip .tt-meta { color: var(--muted); font-size: 10.5px; margin-top: 2px; }
    #rm-canvas, #rm-svg-top { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .rm-stage { overflow: hidden; }
    .rm-sel-ring { fill: none; stroke: var(--ink); stroke-width: 1.4; }
    .rm-scene { will-change: transform; }
    .rm-stage.zooming .rm-cell-title { display: none; }
    .rm-stage.zooming .rm-subband-label { display: none; }
    .rm-stage.zooming .rm-branch.stub { display: none; }
    .rm-stage.zooming text { text-rendering: optimizeSpeed; }
    .rm-cell, .rm-band, .rm-subband, .rm-branch, .rm-branch-tip,
    .rm-cell-title, .rm-band-label, .rm-subband-label { transition: opacity 0.25s; }
    .faded { opacity: 0.07 !important; pointer-events: none; }
    .rm-wip-banner { display: flex; align-items: center; justify-content: center; gap: 4px; height: 28px;
      padding: 0 10px; flex-shrink: 0; font-family: var(--sans); font-size: 11px; color: #e65100;
      background: #fff3e0; border-bottom: 1px solid rgba(230,81,0,0.25); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rm-wip-banner a { color: inherit; text-decoration: underline; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rm-wip-banner {
      color: #ffb74d; background: rgba(230,81,0,0.12); border-color: rgba(255,183,77,0.3); } }
    :root[data-theme="dark"] .rm-wip-banner { color: #ffb74d; background: rgba(230,81,0,0.12); border-color: rgba(255,183,77,0.3); }
    .rm-crumb { cursor: pointer; }
    .rm-crumb:hover { color: var(--accent); text-decoration: underline; }
    .rm-theme-btn { font-family: var(--sans); font-size: 11.5px; font-weight: 500;
      color: var(--muted); background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; height: 30px; padding: 0 10px; cursor: pointer;
      min-width: 52px; }
    .rm-theme-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Body: sidebar + stage ──────────────────────────────────── */
    .rm-body { flex: 1 1 auto; display: flex; min-height: 0; }
    .rm-stage { flex: 1 1 auto; position: relative; min-width: 0; }
    #rm-svg { width: 100%; height: 100%; display: block; cursor: grab; }
    #rm-svg.dragging { cursor: grabbing; }

    /* Phylogenetic branches from the hub, coloured per area (set in JS). */
    .rm-branch { fill: none; stroke-linecap: round; opacity: 0.7; }
    .rm-branch-node { stroke: var(--bg); stroke-width: 1; pointer-events: none; }
    .rm-branch-tip { stroke: var(--bg); stroke-width: 1; pointer-events: none; }
    /* Thick area band with the name curved along it. */
    .rm-band { stroke: none; }
    .rm-band-label { font-family: var(--sans); font-weight: 700; font-size: 52px;
      letter-spacing: 0.04em; fill: #ffffff; pointer-events: none; }
    .rm-subband { stroke: none; }
    .rm-subband-label { font-family: var(--sans); font-weight: 600; font-size: 27px;
      letter-spacing: 0.03em; fill: #ffffff; pointer-events: none; }
    /* Dashed interior guide rings. */
    .rm-guide { fill: none; stroke: var(--border); stroke-dasharray: 6 8; opacity: 0.7; }
    /* File cells — annular sectors, tinted by area (fill set in JS). */
    .rm-cell { stroke: var(--bg); stroke-width: 1; cursor: pointer; }
    .rm-cell:hover { filter: brightness(0.97); }
    .rm-cell.sel { stroke: var(--ink); stroke-width: 1.6; }
    /* Declaration dots inside each cell — coloured by source (validated palette). */
    .rm-dot { stroke: none; cursor: pointer; }
    .rm-dot.physlib { fill: var(--physlib); }
    .rm-dot.alpha { fill: var(--alpha); }
    .rm-dot.claims { fill: var(--claims); }
    .rm-dot.dim { opacity: 0.08; }
    .rm-dot.sel { stroke: var(--ink); stroke-width: 1.4; }
    .rm-hub { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .rm-hub-label { fill: var(--muted); text-anchor: middle; font-weight: 600;
      font-family: var(--sans); pointer-events: none; }
    /* File names sit on an opaque plate over each box. */
    .rm-cell-title { pointer-events: none; }
    .rm-cell-title-bg { fill: var(--bg); opacity: 0.92; stroke: var(--border-subtle); stroke-width: 0.5; }
    .rm-cell-label { font-family: var(--sans); font-weight: 600; fill: var(--ink); }
    .rm-legend-shapes { cursor: default; }
    .rm-area-label { font-family: var(--sans); font-weight: 700; fill: var(--ink);
      paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
      opacity: 0.9; pointer-events: none; }

    .rm-hint, .rm-count { position: absolute; bottom: 12px; font-size: 11px;
      color: var(--faint); background: var(--surface);
      border: 1px solid var(--border-subtle); border-radius: 5px; padding: 4px 8px;
      pointer-events: none; }
    .rm-hint { left: 12px; }
    .rm-count { right: 12px; color: var(--muted); font-family: var(--mono); }
    .rm-credit { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 10.5px; color: var(--faint); pointer-events: auto; white-space: nowrap; }
    .rm-credit a { color: var(--muted); text-decoration: underline; }
    @media (max-width: 760px) { .rm-credit { display: none; } }

    /* ── Sidebar ────────────────────────────────────────────────── */
    .rm-sidebar { width: 340px; flex-shrink: 0; border-left: 1px solid var(--border);
      background: var(--surface); overflow-y: auto; padding: 16px 16px 40px; }

    /* ── Tablets & down: the header controls wrap so they fit ─────── */
    @media (max-width: 980px) {
      .rm-header { height: auto; flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; }
      .rm-title { display: none; }
      .rm-legend { order: 3; flex-basis: 100%; gap: 10px 14px; flex-wrap: wrap; margin-left: 0; }
      .rm-search { margin-left: auto; }
    }
    /* ── Phones: stack the sidebar below the graph ────────────────── */
    @media (max-width: 760px) {
      .rm-wip-banner { white-space: normal; height: auto; line-height: 1.3; padding: 5px 12px; }
      .rm-view { max-width: 44vw; }
      .rm-search input { width: 150px; }
      .rm-search-results { width: min(340px, 92vw); }
      .rm-body { flex-direction: column; }
      .rm-stage { flex: 0 0 58vh; }
      .rm-sidebar { width: auto; flex: 1 1 auto; border-left: none;
        border-top: 1px solid var(--border); padding: 14px 14px 32px; }
      .rm-reset { top: 8px; left: 8px; }
    }
    .rm-sb-kicker { font-size: 10px; font-weight: 600; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
    .rm-sb-name { font-family: var(--mono); font-size: 13.5px; line-height: 1.35;
      word-break: break-word; color: var(--ink); margin-bottom: 10px; }
    .rm-sb-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .rm-badge { font-size: 10.5px; font-weight: 600; border-radius: 4px; padding: 2px 7px;
      color: #fff; }
    .rm-badge.physlib { background: var(--physlib); }
    .rm-badge.alpha { background: var(--alpha); }
    .rm-badge.claims { background: var(--claims); }
    .rm-sb-path { font-family: var(--mono); font-size: 11px; color: var(--muted);
      margin-bottom: 14px; word-break: break-all; }
    .rm-sb-section { font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--faint); margin: 18px 0 8px;
      padding-bottom: 5px; border-bottom: 1px solid var(--border-subtle); }
    .rm-sb-body { font-size: 13px; line-height: 1.55; color: var(--ink); }
    .rm-sb-body p { margin: 0 0 8px; }
    .rm-sb-body h1, .rm-sb-body h2, .rm-sb-body h3 { font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
    .rm-sb-body code { font-family: var(--mono); font-size: 11.5px;
      background: var(--surface-2); border-radius: 3px; padding: 1px 4px; }
    .rm-sb-body ul { margin: 0 0 8px 18px; }
    .rm-statement { font-size: 13px; line-height: 1.55; padding: 10px 12px;
      background: var(--surface-2); border-radius: 6px; border: 1px solid var(--border-subtle); }
    .rm-source { display: block; font-size: 12.5px; line-height: 1.4; padding: 8px 10px;
      border: 1px solid var(--border-subtle); border-radius: 6px; margin-bottom: 6px;
      text-decoration: none; color: var(--ink); }
    .rm-source:hover { border-color: var(--accent); }
    .rm-source .rm-src-arxiv { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
    .rm-empty { font-size: 12.5px; color: var(--muted); font-style: italic; }
    .rm-open { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px;
      font-weight: 500; color: var(--link); text-decoration: none; margin-bottom: 4px; }
    .rm-open:hover { text-decoration: underline; }
    .rm-actions { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
    .rm-btn { display: block; width: 100%; text-align: left; font-family: var(--sans);
      font-size: 12.5px; color: var(--ink); background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
      cursor: pointer; text-decoration: none; }
    .rm-btn:hover { border-color: var(--accent); color: var(--accent); }
    .rm-help { font-size: 12.5px; line-height: 1.6; color: var(--muted); }
    .rm-help b { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body data-palette="#0056b3,#e65100,#a01818">
  <div class="rm-header">
    <a class="rm-logo" href="../">Physlib</a>
    <span class="rm-title">Roadmap</span>
    <select class="rm-view" id="rm-view" aria-label="View"><option value="">Whole map</option></select>
    <div class="rm-legend">
      <span class="rm-legend-item" data-source="Physlib"><span class="rm-swatch physlib"></span>Physlib</span>
      <span class="rm-legend-item" data-source="PhyslibAlpha"><span class="rm-swatch alpha"></span>PhyslibAlpha</span>
      <span class="rm-legend-item" data-source="UnformalizedClaims"><span class="rm-swatch claims"></span>Unformalized</span>
      <span class="rm-legend-item rm-legend-shapes" title="Dot shapes">★ definition · ● lemma</span>
    </div>
    <div class="rm-search">
      <input type="search" id="rm-search-input" placeholder="Search results… ( / )"
             aria-label="Search results" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false">
      <div class="rm-search-results" id="rm-search-results" role="listbox"></div>
    </div>
    <button class="rm-theme-btn" id="rm-theme-btn" title="Theme: auto → dark → light">Auto</button>
  </div>

  <div class="rm-body">
    <div class="rm-stage" id="rm-stage">
      <svg id="rm-svg"></svg>
      <canvas id="rm-canvas"></canvas>
      <svg id="rm-svg-top"></svg>
      <button class="rm-reset" id="rm-reset" title="Reset view (Esc)">⌂ Reset view</button>
      <div class="rm-tooltip" id="rm-tooltip"></div>
      <div class="rm-hint">Scroll to zoom · click a band or box to focus · click a dot · Esc resets</div>
      <div class="rm-credit">Design copied from <a href="https://paperview.org/" target="_blank" rel="noopener">paperview.org</a> · Sabrina Pasterski</div>
      <div class="rm-count" id="rm-count"></div>
    </div>
    <aside class="rm-sidebar" id="rm-sidebar"></aside>
  </div>

  <script src="d3.v7.min.js"></script>
  <script src="roadmap.js"></script>
</body>
</html>
